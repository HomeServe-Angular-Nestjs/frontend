<div *ngIf="sortedTransactions?.length" class="p-6">
    <div
        class="relative pl-6 space-y-6 before:content-[''] before:absolute before:left-[11px] before:top-2 before:bottom-2 before:w-[1px] before:bg-gray-100">

        <div *ngFor="let tnx of sortedTransactions" class="relative">
            <div class="absolute -left-[20px] top-1 w-3 h-3 rounded-full border-2 border-white shadow-sm z-10"
                [ngClass]="tnx.direction === 'credit' ? 'bg-emerald-500' : 'bg-rose-500'">
            </div>
            <div class="p-3 rounded-lg border border-gray-50 hover:bg-gray-50/50 transition-colors">
                <div class="flex items-center justify-between gap-3">
                    <span class="text-xs font-bold text-gray-800">{{ displayType(tnx.transactionType) }}</span>
                    <span class="text-xs font-bold whitespace-nowrap"
                        [ngClass]="tnx.direction === 'credit' ? 'text-emerald-600' : 'text-rose-600'">
                        {{ tnx.direction === 'credit' ? '+' : '&minus;' }}{{ tnx.amount / 100 |
                        currency:'INR':'symbol':'1.2-2' }}
                    </span>
                </div>
                <div class="flex items-center gap-2 mt-1.5">
                    <span class="text-[11px] text-gray-500 capitalize">{{ tnx.source }}</span>
                    <span class="text-[11px] text-gray-300">&middot;</span>
                    <span class="text-[11px] text-gray-400">{{ tnx.createdAt | date:'medium' }}</span>
                    <span *ngIf="tnx.status" class="ml-auto px-2 py-0.5 rounded-full text-[10px] font-bold uppercase"
                        [ngClass]="{
                            'bg-emerald-50 text-emerald-700': tnx.status === 'success',
                            'bg-rose-50 text-rose-700': tnx.status === 'failed',
                            'bg-blue-50 text-blue-700': tnx.status === 'refunded'
                        }">
                        {{ tnx.status }}
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
