<div class="max-w-md p-6 rounded-lg bg-white shadow-lg">
    <h2 class="flex items-center text-xl font-semibold text-gray-800">
        <mat-icon class="mr-2" [class.text-red-500]="!data.isResolve" [class.text-green-500]="data.isResolve">
            {{ data.isResolve ? 'check_circle' : 'cancel' }}
        </mat-icon>
        {{ data.title }}
    </h2>

    <p class="mt-3 text-sm text-gray-600">{{ data.message }}</p>

    <label class="mt-4 block">
        <span class="text-xs font-medium text-gray-500">Resolution note *</span>
        <textarea [(ngModel)]="note" rows="4" placeholder="Record the outcome of your investigation..."
            class="mt-1.5 w-full border border-gray-300 rounded-md px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 resize-none"></textarea>
    </label>

    <div class="mt-6 flex justify-end gap-3">
        <button mat-stroked-button (click)="cancel()"
            class="border border-gray-400 text-gray-700 hover:bg-gray-100 px-4 py-2 rounded-md transition">
            Cancel
        </button>
        <button mat-raised-button [color]="data.isResolve ? 'primary' : 'warn'"
            [disabled]="!note.trim() || isSubmitting()" (click)="confirm()"
            class="px-4 py-2 rounded-md transition disabled:opacity-50"
            [class.bg-green-600]="data.isResolve"
            [class.bg-red-600]="!data.isResolve"
            [class.text-white]="true">
            {{ data.isResolve ? 'Resolve Complaint' : 'Reject Complaint' }}
        </button>
    </div>
</div>
