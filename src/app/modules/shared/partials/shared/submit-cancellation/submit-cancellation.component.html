<div class="fixed inset-0 z-[999] flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm animate-fadeIn">
  <div class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-5 shadow-xl animate-scaleIn sm:p-6">
    <!-- Header -->
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-gray-800 sm:text-xl">Cancel Booking</h2>
    </div>

    <!-- Body -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">
        Reason for cancellation
      </label>

      <textarea [(ngModel)]="cancelReason" rows="4"
        class="w-full resize-none rounded-lg border border-gray-300 p-3 transition focus:outline-none focus:ring-2 focus:ring-indigo-500"
        placeholder="Please describe why you want to cancel..."></textarea>
    </div>

    <!-- Buttons -->
    <div class="flex flex-col-reverse justify-end gap-2 sm:flex-row sm:gap-3">
      <button (click)="closeModal()"
        class="min-h-11 rounded-lg bg-gray-100 px-4 py-2 text-sm font-medium text-gray-800 transition hover:bg-gray-200 sm:min-h-10">
        Close
      </button>

      <button (click)="submitCancellation()" [disabled]="!cancelReason.trim()"
        class="min-h-11 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-indigo-300 sm:min-h-10">
        Submit
      </button>
    </div>
  </div>
</div>
