<nav *ngIf="totalPages > 0" class="flex flex-wrap items-center justify-center gap-2" aria-label="Pagination">
        <button type="button"
            class="inline-flex min-h-10 items-center justify-center rounded-md border border-gray-200 bg-white px-3 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 disabled:cursor-not-allowed disabled:opacity-40"
            aria-label="Previous page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">
            Previous
        </button>

        <ng-container *ngFor="let page of pages">
            <button type="button"
                class="inline-flex min-h-10 min-w-10 items-center justify-center rounded-md border px-3 text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
                [ngClass]="currentPage === page
                    ? 'border-indigo-600 bg-indigo-600 text-white'
                    : 'border-gray-200 bg-white text-gray-700 hover:bg-gray-50'"
                [attr.aria-current]="currentPage === page ? 'page' : null"
                [attr.aria-label]="'Page ' + page"
                (click)="goToPage(page)">
                {{ page }}
            </button>
        </ng-container>

        <button type="button"
            class="inline-flex min-h-10 items-center justify-center rounded-md border border-gray-200 bg-white px-3 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 disabled:cursor-not-allowed disabled:opacity-40"
            aria-label="Next page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">
            Next
        </button>
</nav>
