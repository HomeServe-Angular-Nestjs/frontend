<app-admin-chart-card title="Access Distribution" subtitle="User Plan Breakdown" icon="fa-chart-pie"
    iconBg="bg-indigo-50" iconColor="text-indigo-500" [loading]="isLoading">
    <div class="relative h-full">
        <div class="absolute top-[46%] left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center pointer-events-none"
            *ngIf="!isLoading">
            <span class="text-3xl font-black text-slate-800">{{ totalSubscribers }}</span>
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Total Providers</span>
        </div>

        <div echarts [options]="chartOptions" class="w-full h-full" [loading]="isLoading" [autoResize]="true"></div>
    </div>
</app-admin-chart-card>
