<ng-container *ngIf="bundle">
    <div class="flex flex-col gap-8 pb-8">
        <app-user-details-header [profile]="bundle.profile" [role]="'customer'"
            (statusChanged)="onStatusChanged($event)"></app-user-details-header>

        <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">
            <app-admin-overview-card title="Total Bookings" [value]="bundle.statistics.totalBookings"
                icon="fa-solid fa-calendar-check" iconBg="bg-indigo-100 text-indigo-600"></app-admin-overview-card>
            <app-admin-overview-card title="Completed Bookings" [value]="bundle.statistics.completedBookings"
                icon="fa-solid fa-circle-check" iconBg="bg-green-100 text-green-600"></app-admin-overview-card>
            <app-admin-overview-card title="Cancelled Bookings" [value]="bundle.statistics.cancelledBookings"
                icon="fa-solid fa-ban" iconBg="bg-red-100 text-red-600"></app-admin-overview-card>
            <app-admin-overview-card title="Total Spent"
                [value]="'$' + bundle.statistics.totalAmountSpent.toLocaleString()"
                icon="fa-solid fa-dollar-sign" iconBg="bg-emerald-100 text-emerald-600"></app-admin-overview-card>
            <app-admin-overview-card title="Reviews Written" [value]="bundle.statistics.reviewsWritten"
                icon="fa-solid fa-comments" iconBg="bg-pink-100 text-pink-600"></app-admin-overview-card>
        </div>

        <app-user-details-info-card [title]="'Account Information'" [items]="[
            { label: 'Username', value: bundle.profile.username },
            { label: 'Email', value: bundle.profile.email },
            { label: 'Phone', value: bundle.profile.phone },
            { label: 'User ID', value: bundle.profile.id }
        ]"></app-user-details-info-card>

        <app-address-list [addresses]="bundle.addresses"></app-address-list>
        <app-user-bookings-table [bookings]="bundle.recentBookings"></app-user-bookings-table>
        <app-user-reviews-table [reviews]="bundle.reviews"></app-user-reviews-table>
    </div>
</ng-container>
