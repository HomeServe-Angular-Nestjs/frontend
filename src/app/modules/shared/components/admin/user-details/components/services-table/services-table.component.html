<div class="bg-white rounded-2xl shadow-sm p-6 md:p-8">
    <h3 class="text-lg font-semibold text-gray-800 mb-4">Services</h3>
    <div class="overflow-x-auto rounded-xl border border-gray-100 shadow-sm bg-white">
        <table class="w-full text-sm text-left">
            <thead class="bg-gray-50 text-xs uppercase font-semibold text-gray-500 tracking-wider border-b border-gray-100">
                <tr>
                    <th class="px-6 py-4">Service</th>
                    <th class="px-6 py-4">Category</th>
                    <th class="px-6 py-4">Price</th>
                    <th class="px-6 py-4">Bookings</th>
                    <th class="px-6 py-4">Status</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr *ngFor="let service of services" class="hover:bg-blue-50/40 transition-colors">
                    <td class="px-6 py-4 font-medium text-gray-700">{{ service.service }}</td>
                    <td class="px-6 py-4 text-gray-600">{{ service.category }}</td>
                    <td class="px-6 py-4 font-medium text-gray-800">{{ formatPrice(service.price, service.pricingUnit) }}</td>
                    <td class="px-6 py-4 text-gray-600">{{ service.totalBookings }}</td>
                    <td class="px-6 py-4">
                        <span [ngClass]="service.isActive ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'"
                            class="px-3 py-1 rounded-full text-xs font-medium">
                            {{ service.isActive ? 'Active' : 'Inactive' }}
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
        <div *ngIf="services.length === 0" class="flex flex-col items-center justify-center text-gray-400 py-16">
            <i class="fa-solid fa-wrench text-3xl mb-2 text-gray-300"></i>
            <p class="text-sm">No services found</p>
        </div>
    </div>
</div>
