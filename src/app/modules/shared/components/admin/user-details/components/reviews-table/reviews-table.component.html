<div class="bg-white rounded-2xl shadow-sm p-6 md:p-8">
    <h3 class="text-lg font-semibold text-gray-800 mb-4">Reviews</h3>
    <div class="overflow-x-auto rounded-xl border border-gray-100 shadow-sm bg-white">
        <table class="w-full text-sm text-left">
            <thead class="bg-gray-50 text-xs uppercase font-semibold text-gray-500 tracking-wider border-b border-gray-100">
                <tr>
                    <th class="px-6 py-4">User</th>
                    <th class="px-6 py-4">Rating</th>
                    <th class="px-6 py-4">Review</th>
                    <th class="px-6 py-4">Date</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr *ngFor="let review of reviews" class="hover:bg-blue-50/40 transition-colors align-top">
                    <td class="px-6 py-4 font-medium text-gray-700">{{ review.user.fullname || review.user.username }}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="text-amber-400 text-sm">
                            <i *ngFor="let s of starsArray(review.rating)" class="fa-solid fa-star"></i>
                            <i *ngFor="let s of emptyStarsArray(review.rating)" class="fa-regular fa-star"></i>
                        </span>
                    </td>
                    <td class="px-6 py-4 text-gray-600 max-w-md">{{ review.desc }}</td>
                    <td class="px-6 py-4 text-gray-500">{{ review.date | date: 'MMM d, y' }}</td>
                </tr>
            </tbody>
        </table>
        <div *ngIf="reviews.length === 0" class="flex flex-col items-center justify-center text-gray-400 py-16">
            <i class="fa-solid fa-comment-slash text-3xl mb-2 text-gray-300"></i>
            <p class="text-sm">No reviews found</p>
        </div>
    </div>
</div>
