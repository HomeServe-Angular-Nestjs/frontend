<div class="bg-white rounded-2xl shadow-sm p-6 md:p-8">
    <h3 class="text-lg font-semibold text-gray-800 mb-4">{{ title }}</h3>
    <p *ngIf="subtitle" class="text-xs text-gray-400 mb-4">{{ subtitle }}</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let item of items" class="space-y-1">
            <p class="text-xs uppercase tracking-wide text-gray-500">{{ item.label }}</p>
            <p class="text-sm font-medium text-gray-800">{{ item.value }}</p>
        </div>
    </div>
</div>
