<div class="bg-white p-6 rounded-2xl shadow-lg w-96 max-w-md space-y-4 relative">
    <div class="flex justify-between items-center">
        <h2 class="text-xl font-semibold text-gray-800">{{ isEditMode ? 'Edit Review' : 'Leave a Review' }}</h2>
        <button (click)="closeModalEvent.emit()" class="text-gray-500 hover:text-gray-700 text-2xl leading-none">&times;</button>
    </div>

    <p *ngIf="providerName" class="text-sm text-gray-500 -mt-2">Reviewing {{ providerName }}</p>

    <!-- Star Rating -->
    <div>
        <div class="flex items-center space-x-1">
            <ng-container *ngFor="let star of stars; let i = index">
                <button type="button" class="text-2xl" [disabled]="isSubmitting" [ngClass]="{
                    'text-yellow-400': i < selectedRating,
                    'text-gray-400': i >= selectedRating
                }" (click)="setRating(i + 1)">
                    ★
                </button>
            </ng-container>
            <span class="text-sm text-gray-500 ml-2">{{ selectedRating ? selectedRating + '/5' : 'Tap to rate' }}</span>
        </div>
        <p *ngIf="ratingsControl?.touched && ratingsControl?.invalid" class="text-xs text-red-500 mt-1">
            Please select a star rating.
        </p>
    </div>

    <!-- Review Form -->
    <form [formGroup]="reviewForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Your Review</label>
            <textarea rows="4" formControlName="desc" placeholder="Write your review..."
                [ngClass]="{
                    'border-red-400 focus:ring-red-200 focus:border-red-400': descControl?.touched && descControl?.invalid,
                    'border-gray-300 focus:ring-blue-200 focus:border-blue-400': !(descControl?.touched && descControl?.invalid)
                }"
                class="w-full border rounded-lg p-2 mt-1 outline-none focus:ring-2 transition"></textarea>
            <p *ngIf="descControl?.touched && descControl?.errors?.['required']" class="text-xs text-red-500 mt-1">
                Please write a short review.
            </p>
        </div>

        <button type="submit" [disabled]="isSubmitting"
            class="w-full bg-blue-600 text-white rounded-lg py-2 hover:bg-blue-700 transition disabled:opacity-60 disabled:cursor-not-allowed">
            {{ isSubmitting ? 'Submitting...' : (isEditMode ? 'Update Review' : 'Submit Review') }}
        </button>
    </form>
</div>
