<div role="dialog" aria-modal="true" aria-labelledby="review-modal-title"
    class="w-full bg-white px-5 py-5 sm:px-6 sm:py-6">
    <div class="flex items-start justify-between gap-4">
        <div class="min-w-0">
            <h2 id="review-modal-title" class="text-lg font-bold text-gray-900 sm:text-xl">
                {{ isEditMode ? 'Edit Review' : 'Leave a Review' }}
            </h2>
            <p *ngIf="providerName" class="mt-1 text-sm leading-5 text-gray-500">
                Share your experience with {{ providerName }}
            </p>
        </div>
        <button type="button" (click)="closeModalEvent.emit()" aria-label="Close review dialog"
            class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-xl leading-none text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-700">
            &times;
        </button>
    </div>

    <form [formGroup]="reviewForm" (ngSubmit)="onSubmit()" class="mt-6 space-y-5">
        <div role="group" aria-labelledby="review-rating-label">
            <div class="flex flex-wrap items-center justify-between gap-2">
                <p id="review-rating-label" class="text-sm font-semibold text-gray-800">Your rating</p>
                <span class="text-xs font-medium text-gray-500">
                    {{ selectedRating ? selectedRating + ' out of 5 stars' : 'Choose a rating' }}
                </span>
            </div>
            <div class="mt-2 flex items-center gap-1">
                <button *ngFor="let star of stars; let i = index" type="button"
                    [disabled]="isSubmitting" (click)="setRating(i + 1)"
                    [attr.aria-label]="'Rate ' + (i + 1) + ' out of 5 stars'"
                    [attr.aria-pressed]="selectedRating === i + 1"
                    [ngClass]="{
                        'text-amber-400': i < selectedRating,
                        'text-gray-300 hover:text-amber-300': i >= selectedRating
                    }"
                    class="rounded p-0.5 text-3xl leading-none transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 disabled:cursor-not-allowed">
                    <span aria-hidden="true">★</span>
                </button>
            </div>
            <p *ngIf="ratingsControl?.touched && ratingsControl?.invalid"
                class="mt-1 text-xs text-red-600">
                Please select a star rating.
            </p>
        </div>

        <div>
            <label for="review-description" class="block text-sm font-semibold text-gray-800">Your review</label>
            <textarea id="review-description" rows="5" formControlName="desc"
                placeholder="What did you think of the service?"
                [ngClass]="{
                    'border-red-400 focus:border-red-400 focus:ring-red-100': descControl?.touched && descControl?.invalid,
                    'border-gray-300 focus:border-indigo-500 focus:ring-indigo-100': !(descControl?.touched && descControl?.invalid)
                }"
                class="mt-2 min-h-32 w-full resize-y rounded-xl border bg-white px-3 py-2.5 text-sm leading-6 text-gray-800 outline-none transition focus:ring-2">
            </textarea>
            <p *ngIf="descControl?.touched && descControl?.errors?.['required']"
                class="mt-1 text-xs text-red-600">
                Please write a short review.
            </p>
        </div>

        <button type="submit" [disabled]="isSubmitting"
            class="inline-flex min-h-11 w-full items-center justify-center rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-60">
            {{ isSubmitting ? 'Submitting...' : (isEditMode ? 'Update Review' : 'Submit Review') }}
        </button>
    </form>
</div>
