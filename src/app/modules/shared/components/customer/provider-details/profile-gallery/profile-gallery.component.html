<div class="p-3 sm:p-6 bg-gray-50">
    <ng-container *ngIf="isLoading; else galleryState">
        <div class="mb-5 flex items-center gap-3" aria-live="polite">
            <div class="h-10 w-10 shrink-0 rounded-xl bg-indigo-100 text-indigo-500 flex items-center justify-center">
                <i class="fas fa-images"></i>
            </div>
            <div class="min-w-0">
                <h2 class="font-bold text-gray-900">Loading work gallery</h2>
                <p class="text-sm text-gray-500">Preparing this provider's portfolio...</p>
            </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-5"
            aria-label="Loading gallery images" aria-busy="true">
            <div *ngFor="let _ of [1, 2, 3, 4, 5, 6]"
                class="aspect-square rounded-2xl border border-gray-200 bg-white p-2 shadow-sm">
                <div class="relative h-full w-full overflow-hidden rounded-xl bg-gradient-to-br from-gray-100 via-gray-50 to-gray-100 animate-pulse">
                    <div class="absolute inset-x-3 bottom-3 space-y-2">
                        <div class="h-2.5 w-1/2 rounded-full bg-white/80"></div>
                        <div class="h-2 w-1/3 rounded-full bg-white/60"></div>
                    </div>
                </div>
            </div>
        </div>
    </ng-container>

    <ng-template #galleryState>
        <div *ngIf="loadError; else galleryContent"
            class="rounded-2xl border border-rose-100 bg-white px-5 py-12 text-center shadow-sm">
            <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-rose-50 text-rose-500">
                <i class="fas fa-image text-xl"></i>
            </div>
            <h2 class="text-lg font-bold text-gray-900">Gallery couldn't load</h2>
            <p class="mx-auto mt-2 max-w-md text-sm text-gray-500">
                We couldn't retrieve this provider's work samples. Please try again.
            </p>
            <button type="button" (click)="retryLoad()"
                class="mt-5 inline-flex items-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-indigo-700">
                <i class="fas fa-rotate-right text-xs"></i>
                Try again
            </button>
        </div>
    </ng-template>

    <ng-template #galleryContent>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-5">
            <ng-container *ngIf="workImages.length > 0; else noImages">
                <ng-container *ngFor="let imageUrl of workImages; let i = index">
                    <div
                        class="relative group rounded-xl overflow-hidden shadow-sm hover:shadow-lg transition-all duration-300 aspect-square">
                        <img [src]="imageUrl" [alt]="'Work sample ' + (i + 1)" class="w-full h-full object-cover" />
                        <div
                            class="absolute inset-0 bg-green-900 bg-opacity-0 group-hover:bg-opacity-40 transition duration-300 flex items-center justify-center">
                            <span
                                class="text-white text-sm font-semibold opacity-0 group-hover:opacity-100 transition-opacity">
                                Work #{{ i + 1 }}
                            </span>
                        </div>
                    </div>
                </ng-container>
            </ng-container>

            <ng-template #noImages>
                <p
                    class="col-span-full text-center text-gray-500 bg-white border border-gray-200 p-4 rounded-lg shadow-sm">
                    No work images available.
                </p>
            </ng-template>
        </div>
    </ng-template>
</div>
