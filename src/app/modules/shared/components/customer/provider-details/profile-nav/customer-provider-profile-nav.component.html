<div class="min-w-0 border-b border-gray-200 mb-4 sm:mb-6" id="provider-details-nav">
    <nav class="flex w-full min-w-0 overflow-x-auto" aria-label="Tabs">
        <ng-container *ngFor="let item of items; let index = index">
            <button (click)="changHover(index)" class="shrink-0 border-b-2 px-3 sm:px-4 lg:px-6 py-3 sm:py-4 text-xs sm:text-sm font-medium whitespace-nowrap" [ngClass]="{
                'border-blue-500 text-blue-600': item.active,
                'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300': !item.active,
            }">
                {{item.name}}
            </button>
        </ng-container>
    </nav>
</div>
