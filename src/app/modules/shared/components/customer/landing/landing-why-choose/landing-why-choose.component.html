    <section id="why-choose" class="py-12 sm:py-20 lg:py-24 bg-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="max-w-3xl mx-auto text-center">
          <p class="text-xs font-bold uppercase tracking-widest text-blue-600">Why HomeServe</p>
            <h2
              class="mt-2.5 sm:mt-3 text-2xl sm:text-4xl lg:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight text-balance">
              Book with Total Confidence
            </h2>
            <p class="mt-3 sm:mt-4 text-sm sm:text-lg text-slate-600 leading-relaxed">
              Every booking on HomeServe is protected by the practices that make a marketplace truly trustworthy.
            </p>
        </div>

          <div class="mt-8 sm:mt-14 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
            <div *ngFor="let feature of features; let i = index" appScrollReveal [delay]="i * 80"
              class="group rounded-xl border border-slate-200 bg-white p-5 sm:p-7 shadow-sm transition-all duration-300
              hover:-translate-y-1 hover:border-blue-200 hover:shadow-lg">
              <div
                class="w-11 h-11 sm:w-12 sm:h-12 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center
                text-base sm:text-lg transition-colors duration-300 group-hover:bg-blue-600 group-hover:text-white">
                <i [class]="'fas ' + feature.icon" aria-hidden="true"></i>
              </div>
              <h3 class="mt-4 sm:mt-5 text-base sm:text-lg font-bold text-slate-900 tracking-tight">{{ feature.title }}
              </h3>
              <p class="mt-2 text-xs sm:text-sm leading-relaxed text-slate-600">{{ feature.description }}</p>
            </div>
          </div>
        </div>
    </section>
