<header [class]="'fixed top-0 inset-x-0 z-50 transition-all duration-300 ' + (scrolled() ? 'bg-white/95 backdrop-blur-md shadow-sm' : 'bg-transparent')">
  <nav class="max-w-7xl mx-auto px-6 sm:px-8" aria-label="Main navigation">
    <div class="flex items-center justify-between h-16 lg:h-20">

      <!-- Brand -->
      <a href="/landing_page" (click)="$event.preventDefault(); goHome()"
        class="flex items-center gap-2 shrink-0" aria-label="HomeServe home">
        <svg width="28" height="22" viewBox="0 0 28 22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M13.7549 5.98438C13.8486 5.89062 13.9893 5.84375 14.1299 5.84375C14.2236 5.84375 14.3643 5.89062 14.458 5.98438L23.1299 13.0625V20.75C23.1299 21.1719 22.7549 21.5 22.3799 21.5H17.083C16.708 21.5 16.333 21.1719 16.333 20.75V16.25C16.333 15.875 16.0049 15.5 15.583 15.5H12.583C12.208 15.5 11.833 15.875 11.833 16.25V20.75C11.833 21.1719 11.5049 21.5 11.1299 21.5H5.87988C5.45801 21.5 5.12988 21.1719 5.12988 20.75V13.1094L13.7549 5.98438ZM27.3955 10.8125C27.5361 10.9062 27.6299 11.0938 27.6299 11.2344C27.6299 11.375 27.583 11.5156 27.4893 11.6094L26.2705 13.0625C26.1768 13.2031 26.0361 13.25 25.8486 13.25C25.708 13.25 25.5674 13.2031 25.4736 13.1094L14.458 4.0625C14.3643 3.96875 14.2236 3.92188 14.1299 3.92188C13.9893 3.92188 13.8486 3.96875 13.7549 4.0625L2.73926 13.1094C2.64551 13.2031 2.50488 13.25 2.36426 13.25C2.17676 13.25 2.03613 13.2031 1.94238 13.0625L0.723633 11.6094C0.676758 11.5156 0.583008 11.375 0.583008 11.2344C0.583008 11.0938 0.676758 10.9062 0.817383 10.8125L12.6768 1.01562C13.0518 0.734375 13.5674 0.546875 14.1299 0.546875C14.6455 0.546875 15.1611 0.734375 15.5361 1.01562L19.7549 4.48438V1.10938C19.7549 0.78125 19.9893 0.546875 20.3174 0.546875H22.9424C23.2236 0.546875 23.5049 0.78125 23.5049 1.10938V7.57812L27.3955 10.8125Z"
            [attr.fill]="scrolled() ? '#2563eb' : '#3b82f6'" />
        </svg>
        <span [class]="'text-xl font-extrabold tracking-tight transition-colors ' + (scrolled() ? 'text-slate-900' : 'text-white')">
          HomeServe
        </span>
      </a>

      <!-- Desktop Links -->
      <div class="hidden lg:flex items-center gap-7">
        <ng-container *ngFor="let section of sections">
          <button (click)="scrollToSection($event, section.id)"
            [class]="'text-sm font-semibold transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded ' + (scrolled() ? 'text-slate-600 hover:text-blue-600' : 'text-slate-200 hover:text-white')">
            {{ section.label }}
          </button>
        </ng-container>
        <a routerLink="/provider/signup"
          [class]="'text-sm font-semibold transition-colors ' + (scrolled() ? 'text-slate-600 hover:text-blue-600' : 'text-slate-200 hover:text-white')">
          Become a Provider
        </a>
      </div>

      <!-- Desktop Actions -->
      <div class="hidden lg:flex items-center gap-3">
        <a routerLink="/login" [queryParams]="{ role: 'customer' }"
          [class]="'text-sm font-semibold px-4 py-2 rounded-md transition-colors ' + (scrolled() ? 'text-slate-700 hover:bg-slate-100' : 'text-white hover:bg-white/10')">
          Login
        </a>
        <a routerLink="/signup" [queryParams]="{ role: 'customer' }"
          class="text-sm font-semibold px-4 py-2 rounded-md text-slate-700 bg-white hover:bg-slate-100 transition-colors">
          Register
        </a>
        <button (click)="scrollToSection($event, 'search')"
          class="text-sm font-semibold px-5 py-2.5 rounded-md bg-blue-600 hover:bg-blue-700 text-white transition-colors shadow-sm flex items-center gap-2 focus:outline-none focus-visible:ring-4 focus-visible:ring-blue-500/30">
          <i class="fas fa-calendar-check text-xs"></i>
          Book a Service
        </button>
      </div>

      <!-- Mobile Toggle -->
      <button (click)="mobileOpen.set(!mobileOpen())" aria-label="Toggle menu" [attr.aria-expanded]="mobileOpen()"
        class="lg:hidden h-11 w-11 flex items-center justify-center rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
        [class]="scrolled() ? 'text-slate-700 hover:bg-slate-100' : 'text-white hover:bg-white/10'">
        <i [class]="mobileOpen() ? 'fas fa-xmark text-lg' : 'fas fa-bars text-lg'"></i>
      </button>
    </div>
  </nav>

  <!-- Mobile Menu -->
  <div *ngIf="mobileOpen()" class="lg:hidden bg-white border-t border-slate-100 shadow-lg">
    <div class="px-6 py-4 space-y-1">
      <ng-container *ngFor="let section of sections">
        <button (click)="scrollToSection($event, section.id)"
          class="w-full text-left px-3 py-2.5 rounded-md text-slate-700 hover:bg-slate-50 font-semibold text-sm">
          {{ section.label }}
        </button>
      </ng-container>
      <a routerLink="/provider/signup"
        class="block px-3 py-2.5 rounded-md text-slate-700 hover:bg-slate-50 font-semibold text-sm">
        Become a Provider
      </a>
      <div class="pt-3 border-t border-slate-100 flex flex-col gap-2">
        <a routerLink="/login" [queryParams]="{ role: 'customer' }"
          class="text-center px-4 py-3 rounded-md border border-slate-200 text-slate-700 font-semibold text-sm">
          Login
        </a>
        <a routerLink="/signup" [queryParams]="{ role: 'customer' }"
          class="text-center px-4 py-3 rounded-md bg-blue-600 text-white font-semibold text-sm">
          Register
        </a>
      </div>
    </div>
  </div>
</header>
