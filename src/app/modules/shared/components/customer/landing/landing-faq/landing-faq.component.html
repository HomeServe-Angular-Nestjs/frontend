<section id="faq" class="py-16 sm:py-20 lg:py-24 bg-slate-50">
  <div class="max-w-3xl mx-auto px-6 sm:px-8">
    <div class="text-center">
      <p class="text-xs font-bold uppercase tracking-widest text-blue-600">FAQ</p>
      <h2 class="mt-3 text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight leading-tight">
        Frequently Asked Questions
      </h2>
      <p class="mt-4 text-base text-slate-600">Everything you need to know about booking on HomeServe.</p>
    </div>

    <div class="mt-10 space-y-3">
      <div *ngFor="let faq of faqs; let i = index" appScrollReveal [delay]="i * 60"
        class="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
        <button (click)="toggle(i)" [attr.aria-expanded]="openIndex() === i"
          class="w-full flex items-center justify-between gap-4 px-6 py-5 text-left focus:outline-none focus-visible:ring-4 focus-visible:ring-blue-500/30">
          <span class="font-bold text-slate-900">{{ faq.question }}</span>
          <i [class]="'fas fa-chevron-down text-xs text-slate-400 transition-transform duration-300 ' + (openIndex() === i ? 'rotate-180' : '')"
            aria-hidden="true"></i>
        </button>
        <div *ngIf="openIndex() === i" class="px-6 pb-5 -mt-1">
          <p class="text-sm leading-relaxed text-slate-600">{{ faq.answer }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
