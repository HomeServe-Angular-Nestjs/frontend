    <section id="how-it-works" class="py-12 sm:py-20 lg:py-24 bg-slate-50 border-b border-slate-100">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="max-w-3xl mx-auto text-center">
          <p class="text-xs font-bold uppercase tracking-widest text-blue-600">How It Works</p>
            <h2
              class="mt-2.5 sm:mt-3 text-2xl sm:text-4xl lg:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight text-balance">
              From Search to Done in Five Steps
            </h2>
            <p class="mt-3 sm:mt-4 text-sm sm:text-lg text-slate-600 leading-relaxed">
              HomeServe keeps every booking clear, secure, and easy to manage.
            </p>
        </div>

          <div class="mt-10 sm:mt-16 relative">
            <!-- Connecting line (desktop) -->
            <div class="hidden lg:block absolute top-7 left-0 right-0 h-0.5 bg-slate-200"></div>

              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6 sm:gap-8 lg:gap-6">
                <div *ngFor="let step of steps; let i = index" appScrollReveal [delay]="i * 100"
                  class="group relative flex flex-col items-center text-center p-4 sm:p-0 bg-white sm:bg-transparent
                  rounded-xl sm:rounded-none border sm:border-0 border-slate-200/80 shadow-xs sm:shadow-none">
                  <!-- Step number bubble on the line -->
                  <div
                    class="relative z-10 w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-white border-2 border-blue-100 flex
                    items-center justify-center text-lg sm:text-xl text-blue-600 shadow-sm transition-all duration-300
                    group-hover:border-blue-600 group-hover:bg-blue-600 group-hover:text-white">
                    <i [class]="'fas ' + step.icon" aria-hidden="true"></i>
                  </div>
                  <span class="mt-3 sm:mt-4 text-xs font-black uppercase tracking-widest text-blue-500">{{ '0' + (i + 1)
                    }}</span>
                  <h3 class="mt-1.5 sm:mt-2 text-base sm:text-lg font-bold text-slate-900 tracking-tight">{{ step.title
                    }}</h3>
                  <p class="mt-1.5 sm:mt-2 text-xs sm:text-sm leading-relaxed text-slate-600 max-w-[240px]">{{
                    step.description }}</p>
                </div>
              </div>
            </div>
          </div>
    </section>
