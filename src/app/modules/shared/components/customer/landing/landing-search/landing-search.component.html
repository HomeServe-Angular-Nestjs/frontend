<section id="search" class="relative bg-slate-50 pb-16 sm:pb-20 lg:pb-24">
  <div class="max-w-7xl mx-auto px-6 sm:px-8">
    <!-- Floating Search Card overlapping hero -->
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-6 md:p-8 -mt-12 sm:-mt-14 md:-mt-16 relative z-20">
      <p class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-5 text-center md:text-left">Find a professional</p>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Service -->
        <div class="relative">
          <label for="landing-service" class="sr-only">Service</label>
          <div class="relative">
            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
              <i class="fas fa-tools text-sm"></i>
            </div>
            <input id="landing-service" [(ngModel)]="serviceSearch" (ngModelChange)="filterTitle($event)"
              placeholder="What service do you need?"
              class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all placeholder:text-slate-400 text-sm font-semibold text-slate-700">
          </div>

          <div *ngIf="isServiceDropdownOpen && serviceSearch"
            class="absolute top-full left-0 right-0 mt-2 bg-white rounded-lg shadow-lg border border-slate-100 overflow-hidden py-1.5 z-50">
            <ng-container *ngIf="serviceCategories.length; else noServiceResults">
              <button *ngFor="let category of serviceCategories" (click)="selectCategory(category)"
                class="w-full text-left px-4 py-3 text-sm text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors flex items-center gap-3">
                <i class="fas fa-search text-xs text-slate-300"></i>
                <span class="font-semibold">{{ category.categoryName }}</span>
              </button>
            </ng-container>
            <ng-template #noServiceResults>
              <div class="px-4 py-6 text-sm text-slate-400 text-center font-medium">
                <span *ngIf="isServiceLoading"><i class="fas fa-spinner fa-spin mr-2"></i>Searching services...</span>
                <span *ngIf="!isServiceLoading">No services found</span>
              </div>
            </ng-template>
          </div>
        </div>

        <!-- Location -->
        <div class="relative">
          <label for="landing-location" class="sr-only">Location</label>
          <div class="relative">
            <div class="absolute left-4 top-1/2 -translate-y-1/2 flex items-center gap-2">
              <i class="fas fa-map-marker-alt text-sm text-slate-400"></i>
            </div>
            <input id="landing-location" [(ngModel)]="locationSearch" (ngModelChange)="findLocation($event)"
              placeholder="Where? e.g. Kochi"
              class="w-full pl-11 pr-16 py-3.5 bg-slate-50 border border-slate-200 rounded-md focus:bg-white focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all placeholder:text-slate-400 text-sm font-semibold text-slate-700">
            <button (click)="!loadingCurrentLocation && detectCurrentLocation()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-blue-600 hover:text-blue-700 flex items-center gap-1 transition-colors"
              aria-label="Detect current location">
              <i *ngIf="!loadingCurrentLocation" class="fas fa-location-crosshairs"></i>
              <i *ngIf="loadingCurrentLocation" class="fas fa-spinner fa-spin"></i>
              <span class="hidden sm:inline">Detect</span>
            </button>
          </div>

          <div *ngIf="isLocationDropdownOpen && locationSearch"
            class="absolute top-full left-0 right-0 mt-2 bg-white rounded-lg shadow-lg border border-slate-100 overflow-hidden py-1.5 z-50">
            <ng-container *ngIf="(locationData$ | async) as locationData">
              <ng-container *ngIf="locationData.length; else noLocationResults">
                <button *ngFor="let location of locationData"
                  (click)="locationSearch = location.address; isLocationDropdownOpen = false; selectedLocation = location"
                  class="w-full text-left px-4 py-3 text-sm text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors flex items-center gap-3 truncate">
                  <i class="fas fa-map-pin text-slate-300"></i>
                  <span class="block truncate font-medium">{{ location.address }}</span>
                </button>
              </ng-container>
            </ng-container>
            <ng-template #noLocationResults>
              <div class="px-4 py-6 text-sm text-slate-400 text-center font-medium">
                <span *ngIf="isLocationLoading"><i class="fas fa-spinner fa-spin mr-2"></i>Finding location...</span>
                <span *ngIf="!isLocationLoading">No results found</span>
              </div>
            </ng-template>
          </div>
        </div>

        <!-- Category Select -->
        <div class="md:flex md:items-stretch">
          <select [(ngModel)]="selectedCategoryId" (ngModelChange)="onCategoryChange($event)"
            class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-md focus:bg-white focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all text-sm font-semibold text-slate-700">
            <option value="">All Categories</option>
            <option *ngFor="let cat of categories" [value]="cat.categoryId">{{ cat.name }}</option>
          </select>
        </div>
      </div>

      <div class="mt-4 flex flex-col sm:flex-row items-center gap-3">
        <div class="flex flex-wrap gap-2 justify-center sm:justify-start">
          <span class="text-xs font-semibold text-slate-400 mr-1">Popular:</span>
          <button *ngFor="let cat of popularCategories" (click)="selectLandingCategory(cat)"
            class="text-xs font-semibold px-3 py-1.5 rounded-full bg-blue-50 text-blue-600 hover:bg-blue-100 transition-colors">
            {{ cat.name }}
          </button>
        </div>
        <button (click)="search()"
          class="sm:ml-auto w-full sm:w-auto px-8 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-md transition-all duration-200 flex items-center justify-center gap-2.5 shadow-sm focus:outline-none focus-visible:ring-4 focus-visible:ring-blue-500/30 active:translate-y-0.5">
          <i class="fas fa-magnifying-glass text-xs"></i>
          Search
        </button>
      </div>
    </div>
  </div>
</section>
