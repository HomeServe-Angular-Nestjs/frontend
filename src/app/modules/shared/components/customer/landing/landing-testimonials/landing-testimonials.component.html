<section id="testimonials" class="py-12 sm:py-20 lg:py-24 bg-slate-50 relative overflow-hidden">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="max-w-3xl mx-auto text-center">
      <p class="text-xs font-bold uppercase tracking-widest text-blue-600">Testimonials</p>
      <h2
        class="mt-2.5 sm:mt-3 text-2xl sm:text-4xl lg:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight text-balance">
        Loved by Homeowners Everywhere
      </h2>
      <p class="mt-3 sm:mt-4 text-sm sm:text-lg text-slate-600 leading-relaxed">
        Real reviews from real bookings on HomeServe.
      </p>
    </div>

    <ng-container *ngIf="testimonials.length; else loadingTestimonials">
      (touchend)="onTouchEnd($event)" aria-live="polite">

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
        <figure *ngFor="let t of visibleItems(); let i = index" appScrollReveal
          class="bg-white rounded-xl border border-slate-200 p-5 sm:p-7 shadow-sm transition-all duration-300 hover:shadow-lg hover:-translate-y-1 flex flex-col"
          [ngClass]="{ 'hidden lg:flex': i === 2, 'hidden md:flex': i === 1 }">
          <div class="flex items-center gap-1 text-amber-400 text-xs sm:text-sm">
            <i *ngFor="let s of [1, 2, 3, 4, 5]"
              [class]="s <= Math.round(t.rating) ? 'fas fa-star' : 'fas fa-star text-slate-200'"></i>
          </div>
          <blockquote class="mt-3.5 sm:mt-4 text-xs sm:text-sm leading-relaxed text-slate-600 flex-1">"{{
            t.text }}"</blockquote>
          <figcaption class="mt-5 sm:mt-6 pt-4 sm:pt-5 border-t border-slate-100 flex items-center gap-3">
            <img *ngIf="t.customerAvatar; else avatarFallback" [src]="t.customerAvatar" [alt]="t.customerName"
              loading="lazy" decoding="async" referrerpolicy="no-referrer"
              class="h-10 w-10 sm:h-11 sm:w-11 rounded-full object-cover ring-2 ring-slate-100">
            <ng-template #avatarFallback>
              <div
                class="h-10 w-10 sm:h-11 sm:w-11 rounded-full flex items-center justify-center text-white font-bold ring-2 ring-slate-100 text-sm"
                [style.background-color]="avatarColor(t.customerName)">
                {{ (t.customerName || '?').charAt(0) | uppercase }}
              </div>
            </ng-template>
            <div class="min-w-0">
              <p class="text-xs sm:text-sm font-bold text-slate-900 truncate">{{ t.customerName ||
                'Verified Customer' }}</p>
              <p class="text-[11px] sm:text-xs text-slate-400 truncate">{{ t.serviceName }} · {{ t.date |
                date: 'MMM yyyy' }}</p>
            </div>
          </figcaption>
        </figure>
      </div>

      <!-- Controls -->
      <div class="mt-6 sm:mt-8 flex items-center justify-center gap-3">
        <button (click)="prev()" aria-label="Previous testimonial" class="h-9 w-9 sm:h-10 sm:w-10 rounded-full border border-slate-200 bg-white text-slate-600
                        hover:border-blue-600 hover:text-blue-600 transition-colors focus:outline-none
                        focus-visible:ring-4 focus-visible:ring-blue-500/30 active:scale-95 flex items-center
                        justify-center">
          <i class="fas fa-arrow-left text-xs"></i>
        </button>
        <div class="flex items-center gap-1.5">
          <button *ngFor="let t of testimonials; let i = index" (click)="currentIndex = i"
            [attr.aria-label]="'Go to review ' + (i + 1)" class="h-1.5 rounded-full transition-all duration-300"
            [ngClass]="{ 'w-6 bg-blue-600': i === currentIndex, 'w-1.5 bg-slate-300 hover:bg-slate-400': i !== currentIndex }"></button>
        </div>
        <button (click)="next()" aria-label="Next testimonial" class="h-9 w-9 sm:h-10 sm:w-10 rounded-full border border-slate-200 bg-white text-slate-600
                        hover:border-blue-600 hover:text-blue-600 transition-colors focus:outline-none
                        focus-visible:ring-4 focus-visible:ring-blue-500/30 active:scale-95 flex items-center
                        justify-center">
          <i class="fas fa-arrow-right text-xs"></i>
        </button>
      </div>
    </ng-container>

    <ng-template #loadingTestimonials>
      <div class="mt-8 sm:mt-14 grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">
        <div *ngFor="let _ of [1, 2, 3]" class="rounded-xl border border-slate-100 bg-white p-5 sm:p-7 space-y-4">
          <div class="h-4 bg-slate-100 animate-pulse rounded w-3/4"></div>
          <div class="h-3 bg-slate-100 animate-pulse rounded w-full"></div>
          <div class="h-3 bg-slate-100 animate-pulse rounded w-2/3"></div>
          <div class="h-10 bg-slate-100 animate-pulse rounded-full w-40"></div>
        </div>
      </div>
    </ng-template>
  </div>
</section>
