<div class="h-[100vh] mx-auto max-w-[88rem] flex flex-col overflow-hidden">
    <app-customer-header [isFixed]="false"></app-customer-header>

    <main class="flex-1 flex overflow-hidden mt-16">
        <app-chat-list-area
            [class]="listClass()"
            class="w-full lg:w-[22rem] shrink-0 border-r"></app-chat-list-area>
        <app-chat-message-area
            [class]="messagesClass()"
            class="flex-1 flex flex-col min-h-0 overflow-hidden"></app-chat-message-area>
    </main>
</div>
