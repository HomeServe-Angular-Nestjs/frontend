<div class="mx-auto flex h-[100dvh] min-h-0 max-w-[88rem] flex-col overflow-hidden">
    <app-customer-header [isFixed]="false"></app-customer-header>

    <main
        class="flex min-h-0 flex-1 overflow-hidden pb-[calc(3.5rem+env(safe-area-inset-bottom,0px))] md:mt-16 md:pb-0">
        <app-chat-list-area
            [class]="listClass()"
            class="w-full min-h-0 shrink-0 border-r lg:w-[22rem]"></app-chat-list-area>
        <app-chat-message-area
            [class]="messagesClass()" class="flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden"></app-chat-message-area>
    </main>
</div>
<app-customer-mobile-navigation></app-customer-mobile-navigation>
