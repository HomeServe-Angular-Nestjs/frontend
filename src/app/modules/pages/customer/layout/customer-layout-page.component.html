<div class="md:pb-0">
    <app-customer-header></app-customer-header>
    <main class="md:mt-16 min-h-screen bg-gray-50/30">
        <ng-container *ngIf="!isHomepage">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                <app-breadcrumbs></app-breadcrumbs>
                <router-outlet></router-outlet>
            </div>
        </ng-container>

        <ng-container *ngIf="isHomepage">
            <router-outlet></router-outlet>
        </ng-container>
    </main>
    <app-customer-footer></app-customer-footer>
</div>

<ng-container *ngIf="userStatus() === 'authenticated'">
    <button *ngIf="isMobileMoreOpen" type="button" (click)="closeMoreMenu()"
        class="md:hidden fixed inset-0 z-40 bg-black/10" aria-label="Close more navigation"></button>

    <div class="md:hidden fixed inset-x-0 bottom-0 z-50 border-t border-gray-200 bg-white"
        style="padding-bottom: env(safe-area-inset-bottom, 0px);">
        <div *ngIf="isMobileMoreOpen" id="mobile-customer-more-menu"
            class="absolute bottom-full right-3 mb-2 w-60 border border-gray-200 bg-white py-1">
            <a *ngFor="let item of mobileMoreItems" [routerLink]="item.route" (click)="closeMoreMenu()"
                routerLinkActive="bg-indigo-50 text-indigo-700 font-medium"
                [routerLinkActiveOptions]="{ exact: false }"
                class="flex min-h-11 items-center gap-3 px-4 text-sm text-gray-700 hover:bg-gray-50"
                ariaCurrentWhenActive="page">
                <i [class]="item.icon" class="w-4 text-center" aria-hidden="true"></i>
                <span>{{ item.label }}</span>
            </a>
        </div>

        <nav class="grid grid-cols-5" aria-label="Primary navigation">
            <a *ngFor="let item of mobilePrimaryItems" [routerLink]="item.route" (click)="closeMoreMenu()"
                routerLinkActive="text-indigo-700 font-semibold"
                [routerLinkActiveOptions]="{ exact: item.exact }"
                class="flex min-h-14 flex-col items-center justify-center gap-1 px-1 text-[10px] text-gray-600 hover:text-indigo-700"
                ariaCurrentWhenActive="page">
                <i [class]="item.icon" class="text-base" aria-hidden="true"></i>
                <span class="max-w-full truncate">{{ item.label }}</span>
            </a>
            <button type="button" (click)="toggleMoreMenu()" [attr.aria-expanded]="isMobileMoreOpen"
                aria-controls="mobile-customer-more-menu"
                class="flex min-h-14 flex-col items-center justify-center gap-1 px-1 text-[10px] text-gray-600 hover:text-indigo-700"
                [class.text-indigo-700]="isMobileMoreOpen">
                <i class="fas fa-ellipsis-h text-base" aria-hidden="true"></i>
                <span>More</span>
            </button>
        </nav>
    </div>
</ng-container>
