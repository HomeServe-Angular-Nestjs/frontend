<app-analytics-page
    [status]="(vm$ | async)?.status ?? 'loading'"
    [isEmpty]="(vm$ | async) ? !hasData(vm$ | async) : true"
    emptyIcon="fa-solid fa-chart-column"
    emptyTitle="No data yet"
    emptyMessage="Once you start receiving bookings and reviews, your performance analytics will appear here."
    (retry)="retry()">

    <ng-container *ngIf="vm$ | async as vm">
        <ng-container *ngIf="vm.data as bundle">

            <!-- KPI Summary -->
            <section role="region" aria-label="Key Performance Metrics">
                <app-analytics-section-header
                    eyebrow="Overview"
                    title="Key Performance Metrics"
                    subtitle="A summary of your key service performance indicators and quality metrics">
                </app-analytics-section-header>

                <app-performance-summary [performanceOverviewStats]="bundle.summary.performanceAnalytics"></app-performance-summary>
            </section>

            <!-- Insights -->
            <ng-container *ngIf="buildInsights(bundle) as insights">
                <section *ngIf="insights.length" role="region" aria-label="Insights">
                    <app-analytics-section-header
                        eyebrow="Insights"
                        title="What your data says"
                        subtitle="Automated takeaways derived from this month's performance">
                    </app-analytics-section-header>
                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                        <app-analytics-insight-card
                            *ngFor="let insight of insights"
                            [text]="insight.text"
                            [icon]="insight.icon"
                            [tone]="insight.tone">
                        </app-analytics-insight-card>
                    </div>
                </section>
            </ng-container>

            <!-- Ratings & Bookings -->
            <section role="region" aria-label="Ratings and Bookings">
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    <app-performance-ratings [data]="bundle.bookings.trends"></app-performance-ratings>
                    <app-performance-bookings [data]="bundle.bookings.bookingOverview"></app-performance-bookings>
                </div>
            </section>

            <!-- Reliability Metrics -->
            <section role="region" aria-label="Reliability Metrics">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <app-performance-response-time [data]="bundle.quality.responseTimeDistribution"></app-performance-response-time>
                    <app-performance-on-time-arrival [data]="bundle.quality.onTimeArrival"></app-performance-on-time-arrival>
                </div>
                <div class="mt-6">
                    <app-performance-disputes [data]="bundle.quality.monthlyDisputeStats"></app-performance-disputes>
                </div>
            </section>

            <!-- Performance Comparison -->
            <section role="region" aria-label="Performance Comparison">
                <div class="space-y-6">
                    <app-performance-comparison-overview [overViewData]="bundle.comparison.comparisonOverview"></app-performance-comparison-overview>
                    <app-performance-comparison [data]="bundle.comparison.comparisonStats"></app-performance-comparison>
                </div>
            </section>

        </ng-container>
    </ng-container>

</app-analytics-page>
