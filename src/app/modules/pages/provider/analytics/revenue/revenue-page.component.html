<app-analytics-page
    [status]="(vm$ | async)?.status ?? 'loading'"
    [isEmpty]="(vm$ | async) ? !hasData(vm$ | async) : true"
    emptyIcon="fa-solid fa-money-bill-wave"
    emptyTitle="No data yet"
    emptyMessage="Once you complete bookings, your revenue analytics will appear here."
    (retry)="retry()">

    <ng-container *ngIf="vm$ | async as vm">
        <ng-container *ngIf="vm.data as bundle">

            <!-- KPI Overview -->
            <section role="region" aria-label="Key Revenue Metrics">
                <app-analytics-section-header
                    eyebrow="Overview"
                    title="Key Performance Metrics"
                    subtitle="A summary of your key financial indicators and operational highlights">
                </app-analytics-section-header>

                <app-revenue-overview [revenueStats]="bundle.summary.revenueOverview"></app-revenue-overview>
            </section>

            <!-- Insights -->
            <ng-container *ngIf="buildInsights(bundle) as insights">
                <section *ngIf="insights.length" role="region" aria-label="Insights">
                    <app-analytics-section-header
                        eyebrow="Insights"
                        title="What your revenue says"
                        subtitle="Automated takeaways derived from this month's earnings">
                    </app-analytics-section-header>
                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                        <app-analytics-insight-card
                            *ngFor="let insight of insights"
                            [text]="insight.text"
                            [icon]="insight.icon"
                            [tone]="insight.tone">
                        </app-analytics-insight-card>
                    </div>
                </section>
            </ng-container>

            <!-- Revenue Trends -->
            <section role="region" aria-label="Revenue Trends">
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    <app-revenue-trend-chart [data]="bundle.trends.trend"></app-revenue-trend-chart>
                    <app-revenue-composition-chart [data]="bundle.growth.composition"></app-revenue-composition-chart>
                </div>
            </section>

            <!-- Monthly Growth Forecast -->
            <section role="region" aria-label="Monthly Growth and Forecast">
                <div class="grid grid-cols-1 gap-6">
                    <app-revenue-earnings-forecast-chart [data]="bundle.growth.monthlyGrowth"></app-revenue-earnings-forecast-chart>
                </div>
            </section>

            <!-- Top Clients / Services -->
            <section role="region" aria-label="Top Revenue Sources">
                <app-revenue-top-services-chart [data]="bundle.growth.topServices"></app-revenue-top-services-chart>
            </section>

            <!-- Client Loyalty -->
            <section role="region" aria-label="Customer Loyalty and Retention">
                <app-revenue-repeat-vs-new-customers-chart [data]="bundle.clients.newAndReturning"></app-revenue-repeat-vs-new-customers-chart>
            </section>

        </ng-container>
    </ng-container>

</app-analytics-page>
