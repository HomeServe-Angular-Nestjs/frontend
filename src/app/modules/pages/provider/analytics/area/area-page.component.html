<app-analytics-page
    [status]="(vm$ | async)?.status ?? 'loading'"
    [isEmpty]="(vm$ | async) ? !hasData(vm$ | async) : true"
    emptyIcon="fa-solid fa-location-dot"
    emptyTitle="No data yet"
    emptyMessage="Once you complete bookings across your service areas, analytics will appear here."
    (retry)="retry()">

    <ng-container *ngIf="vm$ | async as vm">
        <ng-container *ngIf="vm.data as bundle">

            <!-- KPI Overview -->
            <section role="region" aria-label="Key Area Metrics">
                <app-analytics-section-header
                    eyebrow="Overview"
                    title="Key Area Metrics"
                    subtitle="Overview of top-performing and underperforming areas">
                </app-analytics-section-header>

                <app-area-analytics-summary [areaSummary]="bundle.summary.areaSummary"></app-area-analytics-summary>
            </section>

            <!-- Insights -->
            <ng-container *ngIf="buildInsights(bundle) as insights">
                <section *ngIf="insights.length" role="region" aria-label="Insights">
                    <app-analytics-section-header
                        eyebrow="Insights"
                        title="What your areas say"
                        subtitle="Automated takeaways derived from this month's area performance">
                    </app-analytics-section-header>
                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                        <app-analytics-insight-card
                            *ngFor="let insight of insights"
                            [text]="insight.text"
                            [icon]="insight.icon"
                            [tone]="insight.tone">
                        </app-analytics-insight-card>
                    </div>
                </section>
            </ng-container>

            <!-- Service Demand -->
            <section role="region" aria-label="Service Demand by Area">
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    <app-area-service-demand-chart [data]="bundle.demand.serviceDemand"></app-area-service-demand-chart>
                    <app-top-areas-revenue [data]="bundle.revenue.topAreas"></app-top-areas-revenue>
                </div>
            </section>

            <!-- Revenue by Location -->
            <section role="region" aria-label="Revenue by Location">
                <app-area-by-revenue [data]="bundle.demand.byLocation"></app-area-by-revenue>
            </section>

            <!-- Underperforming Areas -->
            <section role="region" aria-label="Underperforming Areas">
                <app-underperforming-areas [data]="bundle.revenue.underperforming"></app-underperforming-areas>
            </section>

            <!-- Peak Service Times -->
            <section role="region" aria-label="Peak Service Times">
                <app-peak-service-times [data]="bundle.peak.peakServiceTime"></app-peak-service-times>
            </section>

        </ng-container>
    </ng-container>

</app-analytics-page>
