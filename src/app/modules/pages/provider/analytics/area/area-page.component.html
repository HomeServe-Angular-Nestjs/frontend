<div class="min-h-screen bg-gradient-to-br from-emerald-50 via-green-50 to-lime-50">
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12">

        <ng-container *ngIf="bundle$ | async as bundle; else loadingState">

            <!-- KPI Overview -->
            <section>
                <h2 class="text-2xl font-semibold text-emerald-800 mb-3">Key Area Metrics</h2>
                <p class="text-sm text-gray-500 mb-6">
                    Overview of top-performing and underperforming areas
                </p>

                <app-area-analytics-summary [areaSummary]="bundle.summary.areaSummary"></app-area-analytics-summary>
            </section>

            <!-- Service Demand -->
            <section>
                <h2 class="text-2xl font-semibold text-emerald-800 mb-3">Service Demand by Area</h2>
                <p class="text-sm text-gray-500 mb-6">
                    Visualize which areas have the highest demand for your services
                </p>

                <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    <app-area-service-demand-chart [data]="bundle.demand.serviceDemand"></app-area-service-demand-chart>
                    <app-top-areas-revenue [data]="bundle.revenue.topAreas"></app-top-areas-revenue>
                </div>
            </section>

            <!-- Revenue by Location -->
            <section>
                <app-area-by-revenue [data]="bundle.demand.byLocation"></app-area-by-revenue>
            </section>

            <!-- Underperforming Areas -->
            <section>
                <app-underperforming-areas [data]="bundle.revenue.underperforming"></app-underperforming-areas>
            </section>

            <!-- Peak Service Times -->
            <section>
                <app-peak-service-times [data]="bundle.peak.peakServiceTime"></app-peak-service-times>
            </section>

        </ng-container>

        <ng-template #loadingState>
            <div class="flex items-center justify-center h-96">
                <div class="text-center">
                    <div
                        class="w-14 h-14 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin mx-auto mb-4">
                    </div>
                    <p class="text-sm font-medium text-emerald-800">Loading area analytics...</p>
                </div>
            </div>
        </ng-template>

    </main>
</div>
